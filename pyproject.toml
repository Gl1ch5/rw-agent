[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rw-agent"
version = "0.1.0"
description = "Ultra-minimal, speed-focused AI file agent with only read & write tools and high prompt-cache hit rate"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gl1ch5" }]
dependencies = [
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
]

[project.scripts]
rw = "rw_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rw_agent"]
